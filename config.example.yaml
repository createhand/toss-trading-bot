# API
api:
  client_id: "your_client_id"
  client_secret: "your_client_secret"
  account_id: null  # null이면 첫 번째 계좌 자동 선택

# 엔진
engine:
  dry_run: true          # 기본값 true (안전). false로 변경 시 실전 주문.
  interval_seconds: 60  # 루프 간격
  watch_symbols:
    - "005930"  # 삼성전자
    - "000660"  # SK하이닉스
    - "035420"  # NAVER

# 리스크
risk:
  max_position_pct: 30       # 총 자산 대비 최대 포지션 비율 (%)
  max_single_stock_pct: 20   # 단일 종목 최대 비중 (%)
  daily_loss_limit_pct: 5   # 일일 최대 손실 한도 (%)

# 전략 (Python 모듈 경로)
strategies:
  - strategies.jjs_strategy.JjsStrategy

# 알림
notify:
  log_to_stdout: true
  # webhook_url: null  # 추후 확장
